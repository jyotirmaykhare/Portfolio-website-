<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Open Graph (og-image.png) template — rendered to public/og-image.png by scripts/generate-og-image.mjs -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #f2f2f0;
        position: relative;
      }
      .aurora-a,
      .aurora-b,
      .aurora-c {
        position: absolute;
        border-radius: 50%;
      }
      .aurora-a {
        width: 560px;
        height: 560px;
        background: rgba(93, 154, 255, 0.28);
        filter: blur(120px);
        top: -160px;
        left: -120px;
      }
      .aurora-b {
        width: 480px;
        height: 480px;
        background: rgba(94, 234, 212, 0.2);
        filter: blur(130px);
        bottom: -180px;
        right: 60px;
      }
      .aurora-c {
        width: 420px;
        height: 420px;
        background: rgba(167, 139, 250, 0.22);
        filter: blur(120px);
        top: 120px;
        right: -120px;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
      }
      .content {
        position: absolute;
        inset: 0;
        padding: 92px 108px;
        display: flex;
        flex-direction: column;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 16px;
      }
      .badge-jk {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        background: linear-gradient(135deg, #5eead4, #4d9aff 55%, #a78bfa);
        display: grid;
        place-items: center;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 23px;
        color: #06121a;
      }
      .badge-name {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(242, 242, 240, 0.8);
      }
      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 86px;
        font-weight: 700;
        line-height: 1.03;
        letter-spacing: -0.02em;
        margin-top: 42px;
        max-width: 940px;
      }
      h1 .grad {
        background: linear-gradient(90deg, #5eead4, #4d9aff 55%, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tagline {
        margin-top: 26px;
        font-size: 25px;
        font-weight: 400;
        color: rgba(242, 242, 240, 0.72);
        max-width: 860px;
        line-height: 1.45;
      }
      .url {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 22px;
        letter-spacing: 0.06em;
        color: rgba(242, 242, 240, 0.85);
      }
      .url .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #5eead4;
      }
    </style>
  </head>
  <body>
    <div class="aurora-a"></div>
    <div class="aurora-b"></div>
    <div class="aurora-c"></div>
    <div class="grid"></div>
    <div class="frame"></div>
    <div class="content">
      <div class="badge">
        <span class="badge-jk">JK</span>
        <span class="badge-name">Portfolio</span>
      </div>
      <h1>Jyotirmay Khare<br /><span class="grad">Full Stack Developer</span></h1>
      <p class="tagline">Building real software products across web, data, cloud and interactive experiences.</p>
      <div class="url"><span class="dot"></span>jyotirmaykhare.dev</div>
    </div>
  </body>
</html>
